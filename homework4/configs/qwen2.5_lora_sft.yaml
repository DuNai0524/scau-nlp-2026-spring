### model
model_name_or_path: /root/.cache/modelscope/hub/models/Qwen/Qwen2___5-7B-Instruct
template: qwen
quantization_bit: 4
quantization_method: bitsandbytes

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
use_rslora: true
gradient_checkpointing: true

### dataset
dataset: intent_classification
eval_dataset: intent_classification_dev
dataset_dir: data/intent_classification
cutoff_len: 1024
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: saves/qwen2.5-7b/qlora/sft
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.5e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_steps: 50
fp16: true
ddp_timeout: 180000000

### eval
val_size: 0.0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
load_best_model_at_end: true
